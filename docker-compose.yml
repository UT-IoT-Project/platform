services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

  mosquitto:
    image: eclipse-mosquitto:2.1-alpine
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./configs/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./volumes/mosquitto/data:/mosquitto/data
      - ./volumes/mosquitto/log:/mosquitto/log

  influxdb3:
    image: influxdb:3.11-core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8181:8181"
    env_file:
      - ./configs/influxdb3.env
    volumes:
      - ./volumes/influxdb3/data:/var/lib/influxdb3/data

  telegraf:
    image: telegraf:1.40.2-alpine
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb3
    environment:
      INFLUXDB3_AUTH_TOKEN: ${INFLUXDB3_AUTH_TOKEN:-}
    volumes:
      - ./configs/telegraf.conf:/etc/telegraf/telegraf.conf:ro
