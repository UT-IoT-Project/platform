# MQTT listener for local project development.
listener 1883
# Cap this listener at QoS 1; publishers still need to choose QoS 1 explicitly.
max_qos 1
allow_anonymous true

# Persist broker state and write logs to the mounted directories.
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Add broker receipt time to sensor JSON before subscribers receive it.
plugin /mosquitto/plugins/mosquitto_ingress_timestamp.so
