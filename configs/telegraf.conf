[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/+/+"]
  qos = 1
  persistent_session = true
  client_id = "busyness-telegraf-room"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sensors/+/+"
    tags = "_/building/room"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "room_telemetry"
    timestamp_path = "timestamp"
    timestamp_format = "unix_ms"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temperature"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "pressure"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "humidity"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "co2equivalent"
      type = "float"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "voc"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "iaq"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "mic_vol"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "busy_level"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wifiPackets"
      type = "int"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "bleAdvertisements"
      type = "int"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["sensors/+/+"]
  qos = 1
  persistent_session = true
  client_id = "busyness-telegraf-pirs"
  topic_tag = ""
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sensors/+/+"
    tags = "_/building/room"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "pir_reading"
    timestamp_path = "timestamp"
    timestamp_format = "unix_ms"

    [[inputs.mqtt_consumer.json_v2.object]]
      path = "PIRs"
      included_keys = ["ID", "value"]
      tags = ["ID"]
      [inputs.mqtt_consumer.json_v2.object.renames]
        ID = "pir_id"
      [inputs.mqtt_consumer.json_v2.object.fields]
        value = "float"

[[outputs.influxdb_v3]]
  urls = ["http://influxdb3:8181"]
  token = "${INFLUXDB3_AUTH_TOKEN}"
  database = "busyness_sensing"
