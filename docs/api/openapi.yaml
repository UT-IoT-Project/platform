openapi: 3.1.0
info:
  title: Busyness Sensing Readings API
  version: 1.0.0
  description: Planned contract for retrieving selected sensor readings over a time range; the HTTP route is not yet implemented.
paths:
  /api/v1/readings/{building}/{roomNumber}:
    get:
      summary: Retrieve sensor readings
      description: >-
        Planned response for the selected building and room. ESP32 payloads
        have no timestamp. Mosquitto adds a Unix millisecond timestamp at
        broker receipt, and Telegraf uses it as the time of room and PIR
        points, including messages queued while Telegraf is offline. This is
        not device sampling time; ESP32 buffering and network delay before
        broker receipt are not represented. Broker clock accuracy affects
        these times. QoS 1 duplicates are not deduplicated, and millisecond
        collisions may merge points in a series. The planned API formats
        timestamps as `YYYY-MM-DD HH:mm:ss.SSS` in the server's configured
        local timezone.
        Supply one `sensors` query parameter per requested sensor. For
        example:
        `/api/v1/readings/zilverling/Z2402?start_time=2026-10-14%2010:00:00.000&end_time=2026-10-14%2011:00:00.000&sensors=PIR&sensors=temp`.
      operationId: getReadings
      parameters:
        - name: building
          in: path
          required: true
          description: Building identifier to retrieve readings from.
          schema:
            type: string
          example: zilverling
        - name: roomNumber
          in: path
          required: true
          description: Room identifier within the selected building.
          schema:
            type: string
          example: Z2402
        - name: start_time
          in: query
          required: true
          description: Start of the requested range, in the server's configured local timezone.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-10-14 10:00:00.000'
        - name: end_time
          in: query
          required: true
          description: End of the requested range, in the server's configured local timezone.
          schema:
            $ref: '#/components/schemas/Timestamp'
          example: '2026-10-14 11:00:00.000'
        - name: sensors
          in: query
          required: true
          description: >-
            Case-sensitive sensor names to retrieve. Supply one query
            parameter per sensor. Supported names are PIR, pressure, hum, temp,
            co2equivalent, voc, airresistance, mic_vol, and busy_level. PIR
            returns all PIR readings grouped by timestamp.
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum:
                - PIR
                - pressure
                - hum
                - temp
                - co2equivalent
                - voc
                - airresistance
                - mic_vol
                - busy_level
          examples:
            multiple:
              summary: Request multiple sensors using repeated keys
              value:
                - PIR
                - temp
      responses:
        '200':
          description: Readings retrieved successfully. Sensors without readings are returned with empty arrays.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingsResponse'
              examples:
                populated:
                  summary: Requested sensors have readings
                  value:
                    status: 200
                    message: data retrieved successfully
                    data:
                      PIR:
                        - timestamp: '2026-10-14 10:15:30.250'
                          values:
                            - ID: pir-1
                              value: 1
                            - ID: pir-2
                              value: 0
                            - ID: pir-3
                              value: 1
                      pressure:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 1013.25
                      hum:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 48.5
                      temp:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 21.7
                      co2equivalent:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 612.0
                      voc:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 0.42
                      airresistance:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 12345.6
                      mic_vol:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 0.18
                      busy_level:
                        - timestamp: '2026-10-14 10:16:00.000'
                          value: 2
                empty:
                  summary: Requested sensors have no readings in the range
                  value:
                    status: 200
                    message: data retrieved successfully
                    data:
                      PIR: []
                      pressure: []
                      hum: []
                      temp: []
                      co2equivalent: []
                      voc: []
                      airresistance: []
                      mic_vol: []
                      busy_level: []
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
              examples:
                invalidTimestamp:
                  summary: Timestamp does not match the required format
                  value:
                    status: 400
                    message: Invalid timestamp format.
                    data: {}
                emptySensors:
                  summary: Sensors query parameter is missing or empty
                  value:
                    status: 400
                    message: Empty list of sensors are not allowed.
                    data: {}
                unknownSensor:
                  summary: Sensor name is not supported
                  value:
                    status: 400
                    message: Unknown sensor name.
                    data: {}
        '404':
          description: The requested building or room does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
              example:
                status: 404
                message: Building or room not found.
                data: {}
        '500':
          description: Unexpected server error. The message describes the error without exposing internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
              example:
                status: 500
                message: Internal server error.
                data: {}
components:
  schemas:
    Timestamp:
      type: string
      description: Timestamp formatted as YYYY-MM-DD HH:mm:ss.SSS in the server's configured local timezone.
      pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3}$'
      examples:
        - '2026-10-14 10:00:00.000'
    Reading:
      type: object
      required:
        - timestamp
        - value
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        value:
          type: number
    BusyLevelReading:
      type: object
      description: Timestamped busy_level reading. The source value is an int8.
      required:
        - timestamp
        - value
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        value:
          type: integer
          minimum: -128
          maximum: 127
    PIRValue:
      type: object
      additionalProperties: false
      required:
        - ID
        - value
      properties:
        ID:
          type: string
        value:
          type: number
    PIRReading:
      type: object
      description: All PIR readings at the given timestamp, with each sensor ID preserved alongside its numeric value.
      additionalProperties: false
      required:
        - timestamp
        - values
      properties:
        timestamp:
          $ref: '#/components/schemas/Timestamp'
        values:
          type: array
          items:
            $ref: '#/components/schemas/PIRValue'
    SensorData:
      type: object
      description: Requested sensor names map to timestamped readings. PIR readings are grouped by timestamp; other sensors use scalar values.
      properties:
        PIR:
          type: array
          items:
            $ref: '#/components/schemas/PIRReading'
        pressure:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        hum:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        temp:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        co2equivalent:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        voc:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        airresistance:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        mic_vol:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        busy_level:
          type: array
          items:
            $ref: '#/components/schemas/BusyLevelReading'
      additionalProperties: false
    ReadingsResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          const: 200
        message:
          type: string
          const: data retrieved successfully
        data:
          $ref: '#/components/schemas/SensorData'
    ErrorResponse:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          enum:
            - 400
            - 404
            - 500
        message:
          type: string
          description: Validation message or a generic server error message that does not expose internal details.
        data:
          type: object
          maxProperties: 0
    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              const: 400
            message:
              enum:
                - Invalid timestamp format.
                - Empty list of sensors are not allowed.
                - Unknown sensor name.
    NotFoundResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              const: 404
            message:
              const: Building or room not found.
    ServerErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              const: 500
            message:
              const: Internal server error.
